# Unai on Render — LibreChat fork (free web tier)
# Bring your own MongoDB Atlas URI when approving the Blueprint.

services:
  - type: web
    name: unai
    runtime: image
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    image:
      url: registry.librechat.ai/librechat-ai/librechat-dev:latest
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_TITLE
        value: Unai
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: DOMAIN_CLIENT
        value: https://unai.onrender.com
      - key: DOMAIN_SERVER
        value: https://unai.onrender.com
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        value: user_provided
      - key: ANTHROPIC_API_KEY
        value: user_provided
      - key: GOOGLE_KEY
        value: user_provided
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CREDS_KEY
        sync: false
      - key: CREDS_IV
        sync: false
