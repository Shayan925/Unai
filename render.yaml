# Unai on Render — LibreChat + LiteLLM proxy + MongoDB

services:
  - type: web
    name: unai
    runtime: docker
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile.unai
    dockerContext: .
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_TITLE
        value: Unai
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: DOMAIN_CLIENT
        value: https://unai-kxqc.onrender.com
      - key: DOMAIN_SERVER
        value: https://unai-kxqc.onrender.com
      - key: MONGO_URI
        value: mongodb://unai-mongo-kxqc:27017/Unai
      - key: LITELLM_BASE_URL
        value: http://unai-litellm-kxqc:10000/v1
      - key: LITELLM_API_KEY
        fromService:
          name: unai-litellm
          type: pserv
          envVarKey: LITELLM_MASTER_KEY
      - key: OPENAI_API_KEY
        value: user_provided
      - key: ANTHROPIC_API_KEY
        value: user_provided
      - key: GOOGLE_KEY
        value: user_provided
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CREDS_KEY
        sync: false
      - key: CREDS_IV
        sync: false
      - key: PORT
        value: "10000"

  - type: pserv
    name: unai-litellm
    runtime: docker
    # LiteLLM needs >512Mi; starter OOM'd at boot.
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./Dockerfile.litellm
    dockerContext: .
    envVars:
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: pserv
    name: unai-mongo
    runtime: image
    plan: starter
    region: oregon
    dockerCommand: mongod --bind_ip_all --port 27017
    disk:
      name: unai-mongo-data
      mountPath: /data/db
      sizeGB: 10
    image:
      url: docker.io/library/mongo:8.0.20
